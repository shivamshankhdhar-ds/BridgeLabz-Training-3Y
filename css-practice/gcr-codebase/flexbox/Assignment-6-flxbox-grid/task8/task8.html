
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>
    <link rel="stylesheet" href="task8.css">
</head>
<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful moments and places</p>
    </header>

    <main class="gallery">

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80" alt="Mountain landscape">
            <figcaption>Mountain Landscape</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80" alt="Lake surrounded by mountains">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Ocean and beach">
            <figcaption>Beautiful Beach</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80" alt="Green forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80" alt="Snowy mountain under stars">
            <figcaption>Snowy Mountains</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=600&q=80" alt="Sunrise over a landscape">
            <figcaption>Golden Sunrise</figcaption>
        </figure>

    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery. All rights reserved.</p>
    </footer>

</body>
</html>
