
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="task9.css">
</head>
<body>

    <main class="container">
        <h1>CSS Card Flip Animation</h1>

        <div class="card">
            <div class="card-inner">

                <div class="card-front">

                        src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=600&q=80"
                        alt="People working with technology"

                    <h2>Web Development</h2>
                    <p>Hover to learn more</p>
                </div>

                <div class="card-back">
                    <h2>About Web Development</h2>
                    <p>
                        Web development is the process of creating websites

                        structure, while CSS controls the design and layout.
                    </p>
                </div>

            </div>
        </div>
    </main>
