
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="task4.css">
</head>
<body>

    <div class="dashboard">

        <header class="header">
            <h1>My Dashboard</h1>
            <p>Welcome, Shivam!</p>
        </header>

        <aside class="sidebar">
            <h2>Navigation</h2>
            <nav>
                <a href="#overview">Overview</a>
                <a href="#analytics">Analytics</a>
                <a href="#projects">Projects</a>
                <a href="#settings">Settings</a>
            </nav>
        </aside>

        <main class="main-content" id="overview">

            <section class="box box1">
                <h2>Overview</h2>
                <p>Welcome to your personal dashboard.</p>
            </section>

            <section class="box box2" id="analytics">
                <h2>Analytics</h2>
                <p>View your performance and progress.</p>
            </section>

            <section class="box box3" id="projects">
                <h2>Projects</h2>
                <p>Manage your ongoing projects.</p>
            </section>

            <section class="box box4" id="settings">
                <h2>Settings</h2>
                <p>Customize your dashboard preferences.</p>
            </section>

        </main>

    </div>

</body>
</html>
