<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <style>
        div {
            border: 2px solid black;
        }
        .img1 {
            margin: 10px;
        }
        .img2 {
            /* position: relative;
            top: 100px;
            left: 100px;
            right: 100px; */
            /* position: absolute; */
            /* top: 100px; */
        }
        .img4 {
            position: fixed;
        }
        .img3 {
            position: sticky;
            top: 100px;
        }
        .container {
            background-color: beige;
            height: 8000px;
        }
        .box {
            background-color: aqua;
            height: 1000px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1ktvvXNM2T7ZzB-vzmZZreWCvsaGWh0ckLuq3hO1TlQ&s=10"
        width="300px"
        height="300px"
        class="img1"
        />
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIWymFwebeOzcxfC3_EBhVNn5y4hUSBiposbe4Pnq4cw&s=10"
         alt="image2"
        width="300px"
        height="300px"
        class="img2"
        />
        <img
         src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTjD-_gwbm3PfiNmNsap7AlniZh-udRVxR7y9s8DK3ZSg&s=10"
         alt="image2"
        width="300px"
        height="300px"
        class="img3"
        />
        <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRErzrZ_H7VBJQAT0IzVNpmKV1hlYhTAv5aIgPjy9zgZw&s=10"
        alt="image2"
        width="300px"
        height="300px"
        class="img4"
        />


    </div>
    <div class="box">

    </div>
</body>

</html>
