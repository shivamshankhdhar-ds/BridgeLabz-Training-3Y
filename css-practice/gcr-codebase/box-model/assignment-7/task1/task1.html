<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="task1.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Borders and Padding Demonstration</h1>
        <p>Different border styles and padding examples</p>
    </header>

    <!-- Main content -->
    <main>
        <section class="box-container">
            <!-- Solid border -->
            <div class="box solid">
                <h2>Solid</h2>
                <p>Solid border with small padding.</p>
            </div>

            <!-- Dashed border -->
            <div class="box dashed">
                <h2>Dashed</h2>
                <p>Dashed border with medium padding.</p>
            </div>

            <!-- Double border -->
            <div class="box double">
                <h2>Double</h2>
                <p>Double border with rounded corners.</p>
            </div>

            <!-- Groove border -->
            <div class="box groove">
                <h2>Groove</h2>
                <p>Groove border with different padding.</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Shivam Shankhdhar</p>
    </footer>
</body>
</html>
