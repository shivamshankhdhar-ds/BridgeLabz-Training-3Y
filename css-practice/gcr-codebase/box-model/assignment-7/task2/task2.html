    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="task2.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <!-- Main content -->
    <main>
        <section class="box-container">
            <!-- Box using px -->
            <div class="box box1">
                <h2>Box 1</h2>
                <p>Width: 200px<br>Height: 150px</p>
            </div>

            <!-- Box using percentage -->
            <div class="box box2">
                <h2>Box 2</h2>cd "BridgeLabz-Training-3Y"
                
                <p>Width: 30%<br>Height: 20vh</p>
            </div>

            <!-- Box using em -->
            <div class="box box3">
                <h2>Box 3</h2>
                <p>Width: 15em<br>Height: 12em</p>
            </div>
        </section>
    </main>
