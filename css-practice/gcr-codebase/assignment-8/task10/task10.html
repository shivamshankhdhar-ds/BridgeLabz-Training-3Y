
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 10 - Complete Webpage</title>
    <link rel="stylesheet" href="task10.css">
</head>
<body>

    <!-- Header section -->
    <header class="header">
        <h1>Creative Space</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main content section -->
    <main id="home" class="main-container">

        <!-- Content card -->
        <section class="content-card">

            <div class="image-container">
                <!-- Small image inside the card -->
                <img
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                    alt="Beautiful mountain landscape"
                >
            </div>

            <div class="card-content">
                <h2>Explore Something New</h2>

                <p>
                    Discover beautiful places, learn new skills,
                    and start your next adventure with us.
                </p>

                <!-- Contact form -->
                <form id="contact" class="contact-form">
                    <label for="name">Your Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <!-- Form buttons -->
                    <div class="button-group">
                        <button type="submit" class="primary-btn">
                            Get Started
                        </button>

                        <button type="reset" class="secondary-btn">
                            Reset
                        </button>
                    </div>
                </form>
            </div>

        </section>

    </main>

    <!-- Footer section -->
    <footer class="footer">
        <p>&copy; 2026 Creative Space. All rights reserved.</p>
    </footer>

</body>
</html>
