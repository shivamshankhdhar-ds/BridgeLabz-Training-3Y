
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Gallery</title>
    <link rel="stylesheet" href="task3.css">
</head>
<body>

    <header>
        <h1>Image Showcase Gallery</h1>
        <p>Explore beautiful places through photography.</p>
    </header>

    <main>
        <section class="intro">
            <h2>Explore the Gallery</h2>
            <p>
                Hover over any image to see the zoom and overlay effects.
                Each image includes a caption describing the scene.
            </p>
        </section>

        <!-- Responsive image gallery -->
        <section class="gallery">

            <figure class="gallery-item">
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80"
                        alt="Snow-covered mountain peaks"
                    >
                    <div class="image-overlay"></div>
                </div>
                <figcaption>Majestic Mountains</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                        alt="Sunlight shining through a green forest"
                    >
                    <div class="image-overlay"></div>
                </div>
                <figcaption>Peaceful Forest</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                        alt="Scenic landscape under an open sky"
                    >
                    <div class="image-overlay"></div>
                </div>
                <figcaption>Open Landscapes</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
                        alt="Mountain lake surrounded by nature"
                    >
                    <div class="image-overlay"></div>
                </div>
                <figcaption>Mountain Lake</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=800&q=80"
                        alt="Wildlife in a natural landscape"
                    >
                    <div class="image-overlay"></div>
                </div>
                <figcaption>Wildlife Moments</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                        alt="Beautiful scenic destination"
                    >
                    <div class="image-overlay"></div>
                </div>
                <figcaption>Nature's Beauty</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Practice — Assignment 8, Task 3</p>
    </footer>

</body>
</html>
