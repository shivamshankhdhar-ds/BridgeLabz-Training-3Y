
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="task1.css">
</head>
<body>

    <header class="header">
        <h1>Image Filter Gallery</h1>
        <p>Explore six different CSS image filters.</p>
    </header>

    <main>
        <section class="gallery">
            <figure class="gallery-item">
                <img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Nature landscape">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="grayscale" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Mountain scenery">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="sepia" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest scenery">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="brightness" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Lake and mountains">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="contrast" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Mountain peaks">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="hue-rotate" src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600" alt="Wildlife in nature">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>
        </section>
    </main>

    <footer class="footer">
        <p>CSS Filters | Responsive Web Design</p>
    </footer>

</body>
</html>
