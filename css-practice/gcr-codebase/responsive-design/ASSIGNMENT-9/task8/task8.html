
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="task8.css">
</head>
<body>

    <header class="header">
        <h1>Image Filter Comparison</h1>
        <p>Compare the original image with a filtered version.</p>
    </header>

    <main>
        <section class="comparison">
            <figure class="image-card">
                <img
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
                    alt="Original mountain landscape"
                >
                <figcaption>Before — Original Image</figcaption>
            </figure>

            <figure class="image-card">
                <img class="filtered"
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
                    alt="Brightened mountain landscape"
                >
                <figcaption>After — Brightness Filter</figcaption>
            </figure>
        </section>
    </main>

    <footer class="footer">
        <p>CSS Filters | Before and After</p>
    </footer>

</body>
</html>
