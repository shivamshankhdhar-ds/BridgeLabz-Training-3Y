<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Table</Table></title>
</head>
<body>
    <table>
        <thead>
            <th>Student ID</th>
            <th>Student Name</th>
            <th>Gender</th>
            <th>Age</th>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Shivam</td>
                <td>Male</td>
                <td>26</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Aryan</td>
                <td>Male</td>
                <td rowspan="3">21</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Annanya</td>
                <td>Female</td>
                <td></td>
            </tr>
            <tr>
                <td>4</td>
                <td>Vaibhav</td>
                <td>Male</td>
                <td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
