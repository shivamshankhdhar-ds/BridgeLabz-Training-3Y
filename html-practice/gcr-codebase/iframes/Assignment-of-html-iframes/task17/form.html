<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>
    <!-- Form targets the iframe named resultFrame -->
    <h1>Simple Form</h1>

    <form action="result.html" method="get" target="resultFrame">
        <label for="name">Enter Name:</label>
        <input type="text" id="name" name="name" required>
        <button type="submit">Submit</button>
    </form>

    <!-- Result page loads inside this iframe -->
    <iframe
        src="about:blank"
        name="resultFrame"
        title="Submission Result"
        width="400"
        height="150">
    </iframe>
</body>
</html>
