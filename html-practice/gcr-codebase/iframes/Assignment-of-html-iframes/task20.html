<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Defines the webpage title shown in the browser tab -->
    <title>HTML Head Elements</title>

    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Describes the webpage -->
    <meta name="description" content="A demonstration of important HTML head elements.">

    <!-- Specifies the author -->
    <meta name="author" content="Shivam Shankhdhar">

    <!-- Sets the base URL for relative URLs -->
    <base href="https://example.com/">

    <!-- Links an external resource, such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Internal CSS section; left empty as only HTML is required -->
    <style></style>

    <!-- Script element demonstration; left empty -->
    <script></script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This webpage demonstrates the important elements used inside the head section.</p>
    <a href="about">About Example</a>
</body>
</html>
