<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video</title>
</head>
<body>
    <!-- Heading for the embedded video -->
    <h1>My YouTube Video</h1>

    <!-- Responsive YouTube video using percentage dimensions -->
    <iframe
        src="https://www.youtube.com/embed/VIDEO_ID"
        width="80%"
        height="50%"
        title="YouTube Video Player"
        allowfullscreen>
    </iframe>
</body>
</html>
