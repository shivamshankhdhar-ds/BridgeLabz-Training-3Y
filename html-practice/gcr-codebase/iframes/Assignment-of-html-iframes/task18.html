<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Quotations</title>
</head>
<body>
    <!-- Long quotation -->
    <h1>Quotation Examples</h1>
    <blockquote>
        Learning is a continuous process. We should always be ready to
        learn new things &amp; improve our knowledge.
    </blockquote>

    <!-- Short quotation inside a paragraph -->
    <p>
        As the saying goes, <q>Practice makes a person perfect.</q>
        This reminds us to keep improving our skills.
    </p>
</body>
</html>
