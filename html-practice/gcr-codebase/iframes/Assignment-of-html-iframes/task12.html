<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Entities</title>
</head>
<body>
    <!-- Demonstrating HTML entities -->
    <h1>HTML Entities Demonstration</h1>
    <p>
        Less than: &lt;
        Greater than: &gt;
        Ampersand: &amp;
        Double quote: &quot;
        Single quote: &apos;
    </p>
    <p>
        Copyright: &copy;
        Trademark: &trade;
        Registered trademark: &reg;
    </p>
</body>
</html>
