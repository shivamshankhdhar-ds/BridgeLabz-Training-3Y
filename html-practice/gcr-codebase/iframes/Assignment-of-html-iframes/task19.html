<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>
    <!-- Form with autocomplete disabled -->
    <h1>Secure Information Form</h1>

    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <!-- Security note -->
    <p>
        Turning off autocomplete can reduce the automatic filling of
        previously entered information, especially on shared devices.
        It does not replace proper security measures.
    </p>
</body>
</html>
