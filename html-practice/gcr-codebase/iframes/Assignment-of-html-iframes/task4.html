<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN"
    "http://www.w3.org/TR/html4/frameset.dtd">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout</title>
</head>
<frameset rows="25%,75%">
    <!-- Top frame displays navigation links -->
    <frame srcdoc="<a href='task4.html'>Home</a> | <a href='task4.html'>About</a> | <a href='task4.html'>Contact</a>"
        title="Navigation">

    <!-- Bottom frame displays welcome message -->
    <frame srcdoc="<h1>Welcome to My Website</h1>"
        title="Welcome Message">
    <noframes>
        <body>Your browser does not support frames.</body>
    </noframes>
</frameset>
</html>
