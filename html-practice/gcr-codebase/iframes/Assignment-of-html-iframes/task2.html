<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map - Mathura</title>
</head>
<body>
    <!-- Heading for the embedded Google Map -->
    <h1>My City - Mathura</h1>

    <!-- Embed Google Map using an iframe -->
    <!-- loading="lazy" loads the map when it is near the visible area of the page -->
    <iframe
        src="https://maps.google.com/maps?q=Mathura,Uttar%20Pradesh,India&output=embed"
        title="Google Map of Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
