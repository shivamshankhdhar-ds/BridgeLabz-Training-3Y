<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task7.css">
</head>
<body>

    <main class="container py-5">
        <div class="tracker-header d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="h2 mb-1">My Task Tracker</h1>
                <p class="text-secondary mb-0">One task at a time. You've got this!</p>
            </div>

            <span class="badge text-bg-primary fs-6">
                Pending: <span id="pendingCount">4</span>
            </span>
        </div>

        <div class="list-group">
            <div class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h2 class="h6 mb-1">Finish the Bootstrap assignment</h2>
                    <span class="badge text-bg-danger">High</span>
                </div>
                <button type="button" class="btn btn-outline-success complete-btn">
                    Completed <span class="badge text-bg-success">✓</span>
                </button>
            </div>

            <div class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h2 class="h6 mb-1">Revise Java OOP concepts</h2>
                    <span class="badge text-bg-warning">Medium</span>
                </div>
                <button type="button" class="btn btn-outline-success complete-btn">
                    Completed <span class="badge text-bg-success">✓</span>
                </button>
            </div>

            <div class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h2 class="h6 mb-1">Practise coding questions</h2>
                    <span class="badge text-bg-danger">High</span>
                </div>
                <button type="button" class="btn btn-outline-success complete-btn">
                    Completed <span class="badge text-bg-success">✓</span>
                </button>
            </div>

            <div class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h2 class="h6 mb-1">Organize project files</h2>
                    <span class="badge text-bg-secondary">Low</span>
                </div>
                <button type="button" class="btn btn-outline-success complete-btn">
                    Completed <span class="badge text-bg-success">✓</span>
                </button>
            </div>
        </div>

        <p class="text-secondary mt-3">
            Tip: Mark a task completed when you're done with it.
        </p>
    </main>

    <script>
        const taskButtons = document.querySelectorAll(".complete-btn");
        const pendingCount = document.getElementById("pendingCount");

        taskButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                const task = button.closest(".list-group-item");

                if (button.disabled) {
                    return;
                }

                task.classList.add("task-completed");
                button.textContent = "Done ✓";
                button.classList.remove("btn-outline-success");
                button.classList.add("btn-success");
                button.disabled = true;

                const currentCount = Number(pendingCount.textContent);
                pendingCount.textContent = currentCount - 1;
            });
        });
    </script>

</body>
</html>
