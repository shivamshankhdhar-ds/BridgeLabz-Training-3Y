
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Object Updater</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 450px; margin: 30px auto; }
        input { display: block; width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0 15px; }
        button { padding: 10px 18px; }
        pre { background: #f2f2f2; padding: 12px; }
    </style>
</head>
<body>
    <h2>Edit User Details</h2>
    <form id="userForm">
        <label>Name</label>
        <input id="name" required>

        <label>Email</label>
        <input id="email" type="email" required>

        <label>Age</label>
        <input id="age" type="number" min="1" required>

        <button type="submit">Update User</button>
    </form>

    <h3>Updated Object</h3>
    <pre id="output"></pre>
    <script src="q8.js"></script>
</body>
</html>
