
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            display: block;
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
        }

        #closeButton {
            position: absolute;
            top: -35px;
            right: 0;
            color: white;
            background: transparent;
            border: none;
            font-size: 28px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .gallery img {
                height: 130px;
            }
        }
    </style>

    <script src="q5.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Image Gallery</h1>
        <p>Click any image to see a bigger preview.</p>

        <div class="gallery" id="gallery">
            <img src="https://picsum.photos/id/1015/500/350" alt="Mountain landscape">
            <img src="https://picsum.photos/id/1016/500/350" alt="Forest landscape">
            <img src="https://picsum.photos/id/1025/500/350" alt="Dog portrait">
            <img src="https://picsum.photos/id/1035/500/350" alt="River landscape">
            <img src="https://picsum.photos/id/1043/500/350" alt="Coast landscape">
            <img src="https://picsum.photos/id/1069/500/350" alt="Nature landscape">
        </div>
    </div>

    <!-- Modal preview -->
    <div class="modal" id="imageModal">
        <div class="modal-content" id="modalContent">
            <button id="closeButton" type="button" aria-label="Close preview">
                &times;
            </button>

            <img id="modalImage" src="" alt="Enlarged image preview">
        </div>
    </div>
</body>
</html>
