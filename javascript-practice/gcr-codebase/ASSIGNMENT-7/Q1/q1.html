
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 60%;
        }

        button {
            padding: 10px;
            margin: 4px;
            cursor: pointer;
        }

        li {
            margin: 12px 0;
        }

        .product-name {
            margin-right: 10px;
        }
    </style>
    <script src="q1.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Product List Manager</h1>

        <form id="productForm">
            <input
                type="text"
                id="productInput"
                placeholder="Enter product name"
                required
            >
            <button type="submit">Add Product</button>
        </form>

        <h2>Products</h2>
        <ul id="productList"></ul>
    </div>
</body>
</html>
