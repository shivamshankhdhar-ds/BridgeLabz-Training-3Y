
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Coordinates Logger</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f9;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 12px #00000012;
        }

        #trackingBox {
            width: 400px;
            height: 400px;
            max-width: 100%;
            box-sizing: border-box;
            border: 2px solid #333;
            background-color: #eaf3fc;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #coordinates {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }

        #clearButton {
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>

    <script src="q7.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Mouse Coordinates Logger</h1>

        <p>Move your mouse inside the box to see coordinates.</p>
        <p>Double-click inside the box to place a red dot.</p>

        <div id="trackingBox"></div>

        <p id="coordinates">
            clientX: — | clientY: —
        </p>

        <button id="clearButton" type="button">Clear Dots</button>
    </div>
</body>
</html>
