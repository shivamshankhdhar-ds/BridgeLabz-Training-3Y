
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 12px #00000015;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            margin: 8px 5px 0 0;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
        }
    </style>

    <script src="q3.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Registration Form</h1>
        <p id="step-indicator">Step 1 of 3</p>

        <form id="multiStepForm" novalidate>
            <!-- Step 1: Name -->
            <section class="step active">
                <h2>Step 1: Name</h2>

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your name"
                >

                <p id="nameError" class="error"></p>
            </section>

            <!-- Step 2: Email -->
            <section class="step">
                <h2>Step 2: Email</h2>

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                >

                <p id="emailError" class="error"></p>
            </section>

            <!-- Step 3: Password -->
            <section class="step">
                <h2>Step 3: Password</h2>

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                >

                <p id="passwordError" class="error"></p>
            </section>

            <button type="button" id="backButton" disabled>
                Back
            </button>

            <button type="button" id="nextButton">
                Next
            </button>
        </form>

        <section id="summary" hidden>
            <h2>Registration Summary</h2>
            <p id="summaryName"></p>
            <p id="summaryEmail"></p>
            <p class="success">All steps completed successfully!</p>
        </section>
    </div>
</body>
</html>
